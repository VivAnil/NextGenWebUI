<div class="reset-container">
    <h2>Reset Your Password</h2>
    
    <form [formGroup]="resetForm" (ngSubmit)="resetPassword()">
      
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" formControlName="email" placeholder="Enter your email">
      </div>
      <!-- New Password Field -->
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" formControlName="newPassword" placeholder="Enter new password">
      </div>
  
      <!-- Confirm Password Field -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="Confirm new password">
        <div *ngIf="isSubmitted && resetForm.hasError('mismatch')" class="error">
          <small>Passwords do not match</small>
        </div>
      </div>
  
      <!-- Submit Button -->
      <button type="submit" [disabled]="!isNewPasswordFilled()" [class.disabled-button]="!isNewPasswordFilled()">Reset Password</button>
  
      <!-- Success Message -->
      <p *ngIf="successMessage" class="success">{{ successMessage }}</p>
    </form>
  </div>
