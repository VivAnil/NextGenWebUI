<div class="col-md-10 float-left ">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.2.1/jstree.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.2.1/themes/default/style.min.css" />
<div class="back-internal-page width100">
    <div class="heading-title">Application User Master</div>
    <div class="clear-both-20"></div>
    <div class="float-right">
        <div class="float-left" style="margin-top: 5px;">
            <button type="button" title="Download Report in XLS" id="btn_exporttoexcel" class="border-none">
                <i class="fa fa-file-excel-o file-icon" style="font-size: 30px;" aria-hidden="true"></i>
            </button>
        </div>
    </div>
    <div class="clear-both-20"></div>
    <div class="no-more-tables">
        <table class="col-sm-12 table-bordered table-condensed" cellpadding="5">
            <colgroup>
                <col style="background-color: rgb(243,243,243); width: 20%;" />
                <col style="background-color: rgb(255,255,255); width: 30%;" />
                <col style="background-color: rgb(243,243,243); width: 20%;" />
                <col style="background-color: rgb(255,255,255); width: 30%;" />
            </colgroup>
            <tbody>
                <tr>
                    <td class="section-heading" colspan="4">Add New Application User</td>
                </tr>
                <tr>
                    <td>
                        Display Name <span>*</span>

                    </td>
                    <td>
                        <input type="text" id="customRoleName" [(ngModel)] ="customRoleDisplayName" [disabled] ="disableDisplayName" class="input-box-3 width100 " />
                    </td>
                    <td>
                        System user type <span>*</span>

                    </td>
                    <td>
                      <input type="text" [hidden]="!isEditing" [ngModel]="editRoleName" disabled/>
                      <select name="systemRoles" [hidden]="isEditing" id="systemRoles" class="select-box-3 width100" [(ngModel)]="selectedSystemRoleId" (change)="onSelect($event)">
                        <option *ngFor="let role of masterRoleData" [disabled]="role.customRoleExists" [value]="role.systemRoleId" [text]="role.systemRoleName">{{ role.systemRoleName }}</option>
                      </select>

                    </td>
                </tr>
              <tr>
                <td>Assign Role <span>*</span></td>
                <td colspan="3">
                  <div id="html1">
                    
                  </div>
                </td>
              </tr>
                <tr>
                    <td colspan="4" class="text-align-center" align="center">
                        <input type="button" value="Save" class="btn-blck1" (click)="createRole()" [hidden]="isEditing" />
                    </td>

                </tr>

            </tbody>
        </table>
    </div>
    <div class="clear-both-20"></div>
    <div class="clear-both-20"></div>

    <div>


        <div>
            <div class="position-relative padding-10-0">
                <div class="col-md-6 padding-zero float-left">
                    <input type="text" class="input-box-3 width90 padding-10" placeholder="Type to search"
                        id="txt_globalsearch" autocomplete="off">
                </div>
                <div class="col-md-6 padding-zero text-align-right font-size1-1em float-left">
                    <div (click)="openFilter()" class="col-md-4 filter float-left {{activeFilter}}" align="center"><i class="fa fa-filter awe-filter"></i>Filters <i
                            class="fa fa-caret-down rotate arrow awe-arrow"></i></div>
                    <div (click)="openDefault()" class="col-md-4 filter {{activeDefault}} float-left"><i
                            class="fa fa-eye awe-filter margin-right-10px"></i>Default View <i
                            class="fa fa-caret-down rotate arrow awe-arrow"></i></div>
                    <div (click)="openColumn()" class="col-md-4 filter float-left {{activeColumn}}"><i
                            class="fa fa-gear awe-filter margin-right-10px"></i><span id="col-span-box">Columns</span>
                        <i class="fa fa-caret-down rotate arrow awe-arrow"></i></div>
                </div>
                <div class="clear-both"></div>
                <div *ngIf="isFilterOpen" id="filter_tab"  style="display:{{displayFilter}}" class="width100 filter-tab-box">
                    <div id="assigned_tab_filter">
                        <div class="row">
                            <div class="col-sm-4 form-group">
                                <div class="label-text">Profile Name</div>
                                <div>
                                    <input type="text" id="profileName" class="input-box-3 width100">
                                </div>
                            </div>
                            <div class="col-sm-4 form-group">
                                <div class="label-text">System User Type</div>
                                <div>
                                    <input type="text" id="systemUserType" class="input-box-3 width100">
                                </div>
                            </div>
                        
                        </div>
                        <br>
                        <div class="row text-align-center">                            
                            <div  class="col-md-4 float-left text-align-right"><input type="button" class="btn-blck1" id="btn_search" value="Apply Filter"></div>
                            <div class="col-md-4 float-left text-align-left"><input type="button" class="btn-blck1"  value="Cancel" (click)="openFilter()"></div>
                        </div>
                    </div>
                </div>

                <div *ngIf="isColumnOpen" class="filter width50 column-tab-box" style="display:{{displayColumn}}">
                    <div>
                        <label id="lbl_filtercolumnscount">2 out of 3</label> Column <div class="float-right"><a href="#" class="col-reset-btn" id="lnk_resetcolumnfilter">Reset</a></div>

                    </div>
                    <div class="column-tab1">
                        <div id="dv_nfcfiltercolumns">
                            <div class="col-sm-4 float-left text-overflow-ellipsis padding8"><input type="checkbox"
                                    disabled="disabled" checked="checked" id="0" class="cursor-pointer"><label for="0"
                                    class="cursor-pointer">Profile Name</label></div>
                            <div class="col-sm-4 float-left text-overflow-ellipsis padding8"><input type="checkbox"
                                    disabled="disabled" checked="checked" id="1" class="cursor-pointer"><label for="1"
                                    class="cursor-pointer">System User Type</label></div>
                            <div class="col-sm-4 float-left  text-overflow-ellipsis padding8"><input type="checkbox" data-value="2"
                                    onclick="checkGridColumn(2,this)" id="2" checked=""
                                    class="cursor-pointer"><label for="2" class="cursor-pointer">Action</label></div>
                            
                        </div>
                        <div class="clear-both"></div>
                    </div>

                    
                    <div class="clear-both"></div>
                </div>

            </div>
        </div>

        <div>
            <div class="position-relative">
                <button type="button" id="btn_clear_filter" class="clear-filter-btn"><i class="fas fa-filter"></i>Clear
                    Filters</button>
                <div class="page-filter">
                   
                    <select class="select-box-3 padding8">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="200">200</option>
                        <option value="1250">Select All</option>

                    </select>
                </div>
            </div>

            <div id="tabs" class="ui-tabs ui-corner-all ui-widget ui-widget-content">

                <ul role ="tablist" class="ui-tabs-nav ui-corner-all ui-helper-reset ui-helper-clearfix ui-widget-header">
                    <li role="tab" tabindex="0" class="ui-tabs-tab ui-corner-top ui-state-default {{activeTab}}" aria-controls="tabs-2" 
                            aria-labelledby="tab_service" aria-selected="true" aria-expanded="true">
                            <a  id="tab_service" role="presentation" tabindex="-1" class="ui-tabs-anchor" (click)="toggleTab();">All Application Users</a>
                    </li>

                </ul>
                <div id="tabs-1" aria-labelledby="ui-id-1" role="tabpanel" class="ui-tabs-panel ui-corner-bottom ui-widget-content" aria-hidden="true" style="display:{{displayTab}}">
                  <div id="MappedGrid"></div>
                  <div class="datatable-container">
                    <p-table #dt [value]="data" [paginator]="true" [rows]="5" [responsiveLayout]="'scroll'"
                             [globalFilterFields]="globalFilterFields" [rowsPerPageOptions]="[5, 10, 20]">
                      <ng-template pTemplate="header">
                        <tr>
                          <th *ngFor="let col of cols" [style.width]="'20em'" [style.textAlign]="'center'">
                            {{ col.header }}
                          </th>
                        </tr>
                      </ng-template>
                      <ng-template pTemplate="body" let-rowData>
                        <tr>
                          <td *ngFor="let column of cols"
                              [style.width]="'10em'"
                              [style.textAlign]="'center'">
                            <ng-template #textCell>
                              {{ rowData[column.field] }}
                            </ng-template>
                          </td>s
                        </tr>
                      </ng-template>
                      <!-- <ng-template pTemplate="body" let-rowData >
        <tr>
          <td *ngFor="let col of cols" [style.width]="'24em'"  [style.textAlign]="'center'">
            {{ rowData[col.field] }}
          </td>
        </tr>
      </ng-template> -->
                    </p-table>
                  </div>
                </div>
            

            </div>
            <div class="clear-both-5"></div>


        </div>


    </div>
</div>
    <div class="clear-both"></div>
